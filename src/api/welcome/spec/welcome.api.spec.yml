# welcome.api.spec.yml
# Specifications and test cases for welcome Application Backend — Version 1.0.0

version: 1.0.0
service: welcome-api-backend

specifications:

  # Hello world endpoint - basic greeting
  - id: SPEC-WELCOME-001
    title: Hello World Endpoint
    description: |
      Basic hello world greeting endpoint at `GET /api/welcome/hello` 
      that returns a friendly hello world message.
      Response MUST have HTTP status 200 and a JSON body with message and timestamp.
    endpoint:
      method: GET
      path: /api/welcome/hello
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_message_pattern: "^Hello, World!"
      - body_timestamp_exists: true
    tests:
      - id: TC-WELCOME-HELLO-01
        description: "Verify response status is 200."
        input: {}
        expected:
          status_code: 200
      - id: TC-WELCOME-HELLO-02
        description: "Verify Content-Type header includes application/json."
        input: {}
        expected:
          headers:
            content-type: application/json
      - id: TC-WELCOME-HELLO-03
        description: "Verify response contains hello world message and timestamp."
        input: {}
        expected:
          body_message_pattern: "^Hello, World!"
          body_timestamp_exists: true

  # Default greeting endpoint
  - id: SPEC-WELCOME-002
    title: Default Greeting Endpoint
    description: |
      Default greeting endpoint at `GET /api/welcome/greet` 
      that returns a default greeting message.
      Response MUST be HTTP 200 with a standard greeting message.
    endpoint:
      method: GET
      path: /api/welcome/greet
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_message_exists: true
      - body_name_exists: true
      - body_timestamp_exists: true
    tests:
      - id: TC-WELCOME-GREET-01
        description: "Verify default greeting response."
        input: {}
        expected:
          status_code: 200
          body_message_pattern: "Hi from welcome/greet!!"
          body_name_equals: "World"
          body_timestamp_exists: true
      - id: TC-WELCOME-GREET-02
        description: "Verify Content-Type header includes application/json."
        input: {}
        expected:
          headers:
            content-type: application/json

  # Personalized greeting endpoint with name path parameter
  - id: SPEC-WELCOME-003
    title: Personalized Greeting Endpoint
    description: |
      Personalized greeting endpoint at `GET /api/welcome/greet/{name}` 
      that returns a greeting with the provided name from the URL path.
      Response MUST be HTTP 200 with the name parameter included in the greeting message.
    endpoint:
      method: GET
      path: /api/welcome/greet/{name}
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_message_exists: true
      - body_name_exists: true
      - body_timestamp_exists: true
    tests:
      - id: TC-WELCOME-GREET-NAMED-01
        description: "Verify personalized greeting with name in path."
        input:
          path_parameters:
            name: Alice
        expected:
          status_code: 200
          body_message_pattern: "Hi from welcome/greet Alice!!"
          body_name_equals: "Alice"
          body_timestamp_exists: true
      - id: TC-WELCOME-GREET-NAMED-02
        description: "Verify Content-Type header includes application/json."
        input:
          path_parameters:
            name: Bob
        expected:
          headers:
            content-type: application/json

  # Status/health check endpoint
  - id: SPEC-WELCOME-004
    title: Status Health Check Endpoint
    description: |
      Health check endpoint at `GET /api/welcome/status` 
      that returns service status and uptime information.
      Response MUST have HTTP status 200 with status and uptime fields.
    endpoint:
      method: GET
      path: /api/welcome/status
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_status_equals: "ok"
      - body_uptime_exists: true
    tests:
      - id: TC-WELCOME-STATUS-01
        description: "Verify response status is 200."
        input: {}
        expected:
          status_code: 200
      - id: TC-WELCOME-STATUS-02
        description: "Verify Content-Type header includes application/json."
        input: {}
        expected:
          headers:
            content-type: application/json
      - id: TC-WELCOME-STATUS-03
        description: "Verify response contains status ok and uptime."
        input: {}
        expected:
          body_status_equals: "ok"
          body_uptime_exists: true