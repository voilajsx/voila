# demo.api.spec.yml
# Specifications and test cases for demo Application Backend — Version 1.0.0

version: 1.0.0
service: demo-api-backend

specifications:

  - id: SPEC-DEMO-001
    title: Hello World Endpoint
    description: |
      The app SHALL have a `GET /api/demo/hello` endpoint that returns "Hello, World!".
      Response MUST have HTTP status 200 and a JSON body with success=true and proper data structure.
    endpoint:
      method: GET
      path: /api/demo/hello
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_success_equals: true
      - body_data_message_equals: "Hello, World!"
    tests:
      - id: TC-DEMO-GET-HELLO-01
        description: "Verify response status is 200."
        input: {}
        expected:
          status_code: 200
      - id: TC-DEMO-GET-HELLO-02
        description: "Verify Content-Type header includes application/json."
        input: {}
        expected:
          headers:
            content-type: application/json
      - id: TC-DEMO-GET-HELLO-03
        description: "Verify response contains success true and proper data structure."
        input: {}
        expected:
          body_success_equals: true
          body_data_message_equals: "Hello, World!"
