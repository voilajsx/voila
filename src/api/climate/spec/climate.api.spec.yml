# climate.api.spec.yml
# API Specifications and test cases for Climate Weather Application — Version 1.0.0

version: 1.0.0
service: climate-weather-api
description: Weather application providing current weather conditions and location search

specifications:

  # Weather Current Endpoint - City Query
  - id: SPEC-CLIMATE-WEATHER-001
    title: Current Weather by City Name
    description: |
      Get current weather conditions for a specified city name.
      Endpoint SHALL accept city name as query parameter and return temperature, 
      humidity, condition, and location data with request correlation ID.
    endpoint:
      method: GET
      path: /api/climate/weather/current
      query_params:
        - city: string (required, 1-100 chars)
        - units: string (optional, enum: celsius|fahrenheit|kelvin, default: celsius)
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_success_equals: true
      - response_time_less_than: 200
    tests:
      - id: TC-WEATHER-CITY-001
        description: "Get weather for London with default units"
        input:
          query_params:
            city: "London"
        expected:
          status_code: 200
          body_success_equals: true
          body_data_city_equals: "London"
          body_data_temperature_type: number
          body_data_humidity_range: [0, 100]
          body_requestId_format: uuid
      - id: TC-WEATHER-CITY-002
        description: "Get weather for New York with Fahrenheit units"
        input:
          query_params:
            city: "New York"
            units: "fahrenheit"
        expected:
          status_code: 200
          body_success_equals: true
          body_data_city_contains: "New York"
      - id: TC-WEATHER-CITY-003
        description: "Invalid city name should return 400"
        input:
          query_params:
            city: ""
        expected:
          status_code: 400
          body_success_equals: false
          body_error_type_equals: "validation_error"

  # Weather Current Endpoint - Coordinates Query
  - id: SPEC-CLIMATE-WEATHER-002
    title: Current Weather by Geographic Coordinates
    description: |
      Get current weather conditions for specified latitude and longitude coordinates.
      Coordinates SHALL be validated for proper ranges (lat: -90 to 90, lon: -180 to 180).
    endpoint:
      method: GET
      path: /api/climate/weather/current
      query_params:
        - lat: number (required, range: -90 to 90)
        - lon: number (required, range: -180 to 180)  
        - units: string (optional, enum: celsius|fahrenheit|kelvin)
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_success_equals: true
      - response_time_less_than: 200
    tests:
      - id: TC-WEATHER-COORD-001
        description: "Get weather for London coordinates"
        input:
          query_params:
            lat: 51.5074
            lon: -0.1278
        expected:
          status_code: 200
          body_success_equals: true
          body_data_temperature_type: number
          body_data_humidity_type: number
          body_data_condition_type: string
      - id: TC-WEATHER-COORD-002
        description: "Invalid latitude should return 400"
        input:
          query_params:
            lat: 91.0
            lon: 0.0
        expected:
          status_code: 400
          body_success_equals: false
          body_error_code_equals: "INVALID_COORDINATES"
      - id: TC-WEATHER-COORD-003
        description: "Invalid longitude should return 400"
        input:
          query_params:
            lat: 0.0
            lon: 181.0
        expected:
          status_code: 400
          body_success_equals: false

  # Location Search Endpoint
  - id: SPEC-CLIMATE-SEARCH-001
    title: Location Search and Validation
    description: |
      Search for locations by name to get coordinates and country information.
      SHALL support partial matching and return up to specified limit (max 10).
    endpoint:
      method: GET
      path: /api/climate/weather/search
      query_params:
        - query: string (required, 1-100 chars)
        - limit: number (optional, range: 1-10, default: 5)
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - body_success_equals: true
      - response_time_less_than: 500
    tests:
      - id: TC-SEARCH-001
        description: "Search for London locations"
        input:
          query_params:
            query: "London"
            limit: 3
        expected:
          status_code: 200
          body_success_equals: true
          body_data_type: array
          body_data_max_length: 3
      - id: TC-SEARCH-002
        description: "Empty query should return 400"
        input:
          query_params:
            query: ""
        expected:
          status_code: 400
          body_success_equals: false
          body_error_type_equals: "validation_error"
      - id: TC-SEARCH-003
        description: "Query too long should return 400"
        input:
          query_params:
            query: "a" * 101  # 101 characters
        expected:
          status_code: 400
          body_success_equals: false

  # Health Check Endpoint
  - id: SPEC-CLIMATE-HEALTH-001
    title: Application Health Check
    description: |
      Health check endpoint to verify application status and external API connectivity.
      SHALL return 200 for healthy state with timestamp and version information.
    endpoint:
      method: GET
      path: /api/climate/health
    validations:
      - status_code: 200
      - content_type_includes: application/json
      - response_time_less_than: 100
    tests:
      - id: TC-HEALTH-001
        description: "Health check returns OK status"
        input: {}
        expected:
          status_code: 200
          body_status_equals: "ok"
          body_timestamp_format: iso_date
          body_version_equals: "1.0.0"

# Response Schemas
schemas:
  WeatherResponse:
    type: object
    required: [success, data, requestId]
    properties:
      success:
        type: boolean
        example: true
      data:
        $ref: '#/schemas/WeatherData'
      requestId:
        type: string
        format: uuid

  WeatherData:
    type: object
    required: [temperature, humidity, condition, city, country, timestamp]
    properties:
      temperature:
        type: number
        description: Temperature in requested units
      humidity:
        type: number
        minimum: 0
        maximum: 100
        description: Relative humidity percentage
      condition:
        type: string
        description: Weather condition description
      city:
        type: string
        description: City name
      country:
        type: string
        description: Country code
      timestamp:
        type: string
        format: date-time
        description: Data timestamp in ISO format

  LocationSearchResponse:
    type: object
    required: [success, data, requestId]
    properties:
      success:
        type: boolean
      data:
        type: array
        items:
          $ref: '#/schemas/LocationResult'
        maxItems: 10
      requestId:
        type: string
        format: uuid

  LocationResult:
    type: object
    required: [name, country, lat, lon]
    properties:
      name:
        type: string
        description: Location name
      country:
        type: string
        description: Country name
      lat:
        type: number
        minimum: -90
        maximum: 90
      lon:
        type: number
        minimum: -180
        maximum: 180

  ErrorResponse:
    type: object
    required: [success, error]
    properties:
      success:
        type: boolean
        example: false
      error:
        type: object
        required: [type, message, code, requestId]
        properties:
          type:
            type: string
            enum: [validation_error, not_found, external_api_error, server_error]
          message:
            type: string
            description: Human-readable error message
          code:
            type: string
            description: Machine-readable error code
          requestId:
            type: string
            format: uuid

  HealthResponse:
    type: object
    required: [status, timestamp, version]
    properties:
      status:
        type: string
        enum: [ok, error]
      timestamp:
        type: string
        format: date-time
      version:
        type: string
        example: "1.0.0"

# Rate Limiting
rate_limits:
  - path: /api/climate/weather/*
    limit: 100
    window: 60000  # 1 minute in milliseconds
    per: ip
  - path: /api/climate/health
    limit: 1000
    window: 60000
    per: ip

# Performance Requirements
performance:
  - endpoint: /api/climate/weather/current
    max_response_time: 200ms
    target_uptime: 99.9%
  - endpoint: /api/climate/weather/search
    max_response_time: 500ms
    target_uptime: 99.9%
  - endpoint: /api/climate/health
    max_response_time: 100ms
    target_uptime: 99.99%