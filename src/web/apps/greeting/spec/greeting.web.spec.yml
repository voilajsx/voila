# E2E Test flows based on actual application features
e2e_flows:
  - flow_id: "greeting_hello_basic_flow"
    name: "Hello Feature Basic Flow"
    description: "User navigates and interacts with greeting functionality"
    steps:
      - step: 1
        action: "navigate_to"
        target: "/greeting/hello"
        expected: "page_loads_successfully"
      - step: 2
        action: "verify_content"
        target: "greeting_cards"
        expected: "default_greeting_visible"
      - step: 3
        action: "click_element"
        target: "[data-testid='refresh-button']"
        expected: "greeting_refreshes"
      - step: 4
        action: "click_element"
        target: "[data-testid='clear-cache-button']"
        expected: "cache_cleared"
    tests:
      - test_id: "greeting_e2e_hello_basic"
        description: "Complete hello feature basic interaction flow"
        type: "e2e_flow"
        browsers: ["chromium", "firefox", "webkit"]
        expected:
          completion_time_ms: "<10000"
          success_rate: "100%"

  - flow_id: "greeting_authentication_complete_flow"
    name: "Complete Authentication Flow"
    description: "User authenticates with both API key and token to access all greetings"
    steps:
      - step: 1
        action: "navigate_to"
        target: "/greeting/hello"
        expected: "page_loads"
      - step: 2
        action: "verify_initial_state"
        target: "greeting_cards"
        expected: "only_default_greeting_visible"
      - step: 3
        action: "input_text"
        target: "[data-testid='api-key-input']"
        value: "test-api-key"
        expected: "api_key_accepted"
      - step: 4
        action: "verify_content"
        target: "[data-testid='good-day-greeting']"
        expected: "good_day_greeting_appears"
      - step: 5
        action: "input_text"
        target: "[data-testid='auth-token-input']"
        value: "test-auth-token"
        expected: "auth_token_accepted"
      - step: 6
        action: "verify_content"
        target: "[data-testid='thank-you-greeting']"
        expected: "thank_you_greeting_appears"
      - step: 7
        action: "verify_badges"
        target: "[data-testid='status-badges']"
        expected: "all_badges_active"
    tests:
      - test_id: "greeting_e2e_full_authentication"
        description: "Complete authentication flow with API key and token"
        type: "e2e_flow"
        browsers: ["chromium"]
        expected:
          completion_time_ms: "<15000"
          success_rate: "100%"
          all_greetings_visible: true

  - flow_id: "greeting_personal_greeting_flow"
    name: "Personal Greeting Flow"
    description: "User creates personal greetings and navigates to personal page"
    steps:
      - step: 1
        action: "navigate_to"
        target: "/greeting/hello"
        expected: "page_loads"
      - step: 2
        action: "input_text"
        target: "[data-testid='personal-name-input']"
        value: "Alice"
        expected: "name_input_accepted"
