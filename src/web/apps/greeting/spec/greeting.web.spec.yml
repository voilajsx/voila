# greeting Web Application Specification
# Web interface specification for pages, components, and user flows
# Updated based on actual implementation: 2025-09-02

app_info:
  name: "greeting"
  type: "web"
  description: "Interactive greeting web application with multi-language support and logs management"
  version: "1.0.0"
  base_path: "/greeting"

# Page specifications based on actual implementation
pages:
  - page_id: "greeting_hello_root"
    path: "/greeting/hello"
    component: "root.tsx"
    feature: "hello"
    title: "Interactive Greeting Demo"
    description: "Interactive greeting interface with multi-language support and authentication"
    auth_required: false
    seo:
      title: "🌍 Interactive Greeting Demo"
      description: "Showcasing useHello hook with real API integration"
      keywords: ["greeting", "hello", "multilanguage", "personalized", "api", "authentication"]
    tests:
      - test_id: "greeting_hello_page_load"
        description: "Hello page loads successfully with correct title and structure"
        type: "page_load"
        expected:
          status: "success"
          title_contains: "Interactive Greeting Demo"
          load_time_ms: "<3000"
          elements_present: ["header", "auth_form", "greeting_cards", "actions"]
      - test_id: "greeting_hello_responsive"
        description: "Hello page displays correctly on mobile devices"
        type: "responsive_test"
        expected:
          mobile_friendly: true
          grid_responsive: true
          navigation_accessible: true

  - page_id: "greeting_hello_personal"
    path: "/greeting/hello/:name"
    component: "[name].tsx"
    feature: "hello"
    title: "Personal Greeting for {name}"
    description: "Personalized greeting page with name parameter"
    auth_required: false
    tests:
      - test_id: "greeting_personal_load"
        description: "Personal greeting page loads with name parameter"
        type: "page_load"
        input:
          name: "World"
        expected:
          status: "success"
          contains_text: "World"
          personal_greeting_visible: true
          load_time_ms: "<2000"

  - page_id: "greeting_logs_root"
    path: "/greeting/logs"
    component: "root.tsx"
    feature: "logs"
    title: "Greeting Logs"
    description: "Logs management interface with CRUD operations and pagination"
    auth_required: false
    tests:
      - test_id: "greeting_logs_page_load"
        description: "Logs page loads with logs list and controls"
        type: "page_load"
        expected:
          status: "success"
          title_contains: "Logs"
          elements_present: ["logs_list", "pagination", "filters", "actions"]
          load_time_ms: "<3000"

  - page_id: "greeting_logs_details"
    path: "/greeting/logs/:id"
    component: "details.tsx"
    feature: "logs"
    title: "Log Details"
    description: "Individual log entry details and edit interface"
    auth_required: false
    tests:
      - test_id: "greeting_log_details_load"
        description: "Log details page loads with specific log data"
        type: "page_load"
        input:
          id: "test-log-id"
        expected:
          status: "success"
          log_details_visible: true
          edit_form_available: true

# Component specifications based on actual implementation
components:
  - component_id: "greeting_card"
    name: "GreetingCard"
    type: "display"
    feature: "hello"
    description: "Displays greeting data with loading, error, and success states"
    props:
      - name: "greeting"
        type: "HelloResponse"
        required: true
      - name: "loading"
        type: "boolean"
        required: false
      - name: "error"
        type: "Error"
        required: false
      - name: "title"
        type: "string"
        required: true
    tests:
      - test_id: "greeting_card_render_success"
        description: "GreetingCard renders greeting data correctly"
        type: "component_render"
        input:
          greeting: { success: true, data: { greetings: ["Hello World"], name: "Test", language_count: 1 } }
          title: "Test Greeting"
          loading: false
        expected:
          renders: true
          contains_text: "Hello World"
          has_title: "Test Greeting"
          shows_language_count: true
      - test_id: "greeting_card_loading_state"
        description: "GreetingCard shows loading state correctly"
        type: "component_render"
        input:
          title: "Loading Greeting"
          loading: true
        expected:
          shows_loading_display: true
          title_visible: "Loading Greeting..."

  - component_id: "auth_form"
    name: "AuthForm"
    type: "form"
    feature: "hello"
    description: "Authentication form for API key and auth token input"
    props:
      - name: "apiKey"
        type: "string"
        required: true
      - name: "authToken"
        type: "string"
        required: true
      - name: "onApiKeyChange"
        type: "function"
        required: true
      - name: "onAuthTokenChange"
        type: "function"
        required: true
    tests:
      - test_id: "auth_form_interaction"
        description: "Auth form accepts input and triggers callbacks"
        type: "component_interaction"
        input:
          apiKey: "test-key"
          authToken: "test-token"
        expected:
          input_accepted: true
          callbacks_triggered: true
          form_validation_works: true

  - component_id: "logs_list"
    name: "LogsList"
    type: "list"
    feature: "logs"
    description: "Displays paginated list of log entries with filtering"
    props:
      - name: "logs"
        type: "LogEntry[]"
        required: true
      - name: "pagination"
        type: "PaginationInfo"
        required: true
      - name: "onPageChange"
        type: "function"
        required: true
    tests:
      - test_id: "logs_list_render"
        description: "LogsList renders log entries with pagination"
        type: "component_render"
        input:
          logs: [{ id: "1", message: "Test log", level: "info", timestamp: "2025-09-02T00:00:00Z" }]
          pagination: { page: 1, totalPages: 5, hasNext: true, hasPrev: false }
        expected:
          renders: true
          shows_log_entries: true
          pagination_controls_visible: true

  - component_id: "log_details"
    name: "LogDetails"
    type: "detail"
    feature: "logs"
    description: "Displays detailed log entry information with edit capability"
    tests:
      - test_id: "log_details_render"
        description: "LogDetails shows log information and edit options"
        type: "component_render"
        expected:
          log_info_displayed: true
          edit_button_available: true

  - component_id: "log_form"
    name: "LogForm"
    type: "form"
    feature: "logs"
    description: "Form for creating and editing log entries"
    tests:
      - test_id: "log_form_create"
        description: "LogForm can create new log entries"
        type: "component_interaction"
        expected:
          form_fields_present: true
          submit_works: true
          validation_active: true

# Hook specifications based on actual implementation
hooks:
  - hook_id: "use_hello"
    name: "useHello"
    feature: "hello"
    description: "Main hook for greeting functionality with API integration and authentication"
    returns:
      - name: "greetings"
        type: "object"
        description: "Greeting query results (default, goodDay, thankYou)"
      - name: "auth"
        type: "object"
        description: "Authentication state with apiKey, authToken, and setters"
      - name: "actions"
        type: "object"
        description: "Actions (getPersonalGreeting, clearCache, refresh)"
      - name: "computed_state"
        type: "object"
        description: "Computed state (isLoading, hasError, isReady, canShowGoodDay, canShowThankYou)"
    tests:
      - test_id: "use_hello_initial_state"
        description: "useHello hook returns correct initial state structure"
        type: "hook_test"
        expected:
          greetings: "object"
          auth: "object"
          actions: "object"
          state_properties: ["isLoading", "hasError", "isReady"]
      - test_id: "use_hello_authentication_flow"
        description: "useHello handles authentication state changes correctly"
        type: "hook_test"
        expected:
          api_key_updates: true
          auth_token_updates: true
          computed_state_updates: true

  - hook_id: "use_logs"
    name: "useLogs"
    feature: "logs"
    description: "Comprehensive logs management hook with CRUD operations and pagination"
    returns:
      - name: "logs"
        type: "object"
        description: "Logs data with loading, error, and refetch"
      - name: "pagination"
        type: "object"
        description: "Pagination state and navigation"
      - name: "currentLog"
        type: "object"
        description: "Currently selected log entry"
      - name: "actions"
        type: "object"
        description: "CRUD actions (fetchLogs, createLog, updateLog, deleteLog, etc.)"
      - name: "filters"
        type: "object"
        description: "Search and filter functionality"
    tests:
      - test_id: "use_logs_crud_operations"
        description: "useLogs provides complete CRUD functionality"
        type: "hook_test"
        expected:
          create_function: true
          read_function: true
          update_function: true
          delete_function: true
          pagination_works: true
      - test_id: "use_logs_filtering"
        description: "useLogs handles search and filtering correctly"
        type: "hook_test"
        expected:
          search_functionality: true
          level_filtering: true
          filter_clearing: true

# API Integration specifications
api_integration:
  base_url: "http://localhost:8000/api/greeting"
  endpoints:
    # Hello feature endpoints
    - endpoint_id: "greeting_hello_default"
      path: "/hello"
      method: "GET"
      description: "Default greeting endpoint"
      feature: "hello"
      component_usage: ["GreetingCard", "HelloPage"]
      tests:
        - test_id: "greeting_api_hello_default"
          description: "Default greeting API returns success"
          type: "api_integration"
          expected:
            status: 200
            response_time_ms: "<1000"
            response_body:
              success: true
              data:
                greetings: ["array of strings"]
                name: "string"
                language_count: "number"

    - endpoint_id: "greeting_hello_goodday"
      path: "/hello/goodday"
      method: "GET"
      description: "Good day greeting with API key authentication"
      feature: "hello"
      component_usage: ["GreetingCard"]
      auth_required: "api_key"
      tests:
        - test_id: "greeting_api_goodday_auth"
          description: "Good day greeting API requires and validates API key"
          type: "api_integration"
          expected:
            status: 200
            auth_header_required: "X-API-Key"
            authenticated_response: true

    - endpoint_id: "greeting_hello_thankyou"
      path: "/hello/thankyou"
      method: "GET"
      description: "Thank you greeting with token authentication"
      feature: "hello"
      component_usage: ["GreetingCard"]
      auth_required: "auth_token"
      tests:
        - test_id: "greeting_api_thankyou_auth"
          description: "Thank you greeting API requires and validates auth token"
          type: "api_integration"
          expected:
            status: 200
            auth_header_required: "Authorization"
            bearer_token_format: true

    - endpoint_id: "greeting_hello_personal"
      path: "/hello/:name"
      method: "GET"
      description: "Personalized greeting with name parameter"
      feature: "hello"
      component_usage: ["HelloPage"]
      tests:
        - test_id: "greeting_api_personal_name"
          description: "Personal greeting API accepts name parameter"
          type: "api_integration"
          expected:
            status: 200
            name_parameter_used: true
            personalized_response: true

    # Logs feature endpoints
    - endpoint_id: "greeting_logs_list"
      path: "/logs"
      method: "GET"
      description: "Get paginated logs list with filtering"
      feature: "logs"
      component_usage: ["LogsList", "LogsPage"]
      tests:
        - test_id: "greeting_api_logs_list"
          description: "Logs list API returns paginated results"
          type: "api_integration"
          expected:
            status: 200
            pagination_present: true
            logs_array: true

    - endpoint_id: "greeting_logs_get"
      path: "/logs/:id"
      method: "GET"
      description: "Get specific log entry by ID"
      feature: "logs"
      component_usage: ["LogDetails"]
      tests:
        - test_id: "greeting_api_log_get"
          description: "Single log API returns log details"
          type: "api_integration"
          expected:
            status: 200
            log_details_present: true

    - endpoint_id: "greeting_logs_create"
      path: "/logs"
      method: "POST"
      description: "Create new log entry"
      feature: "logs"
      component_usage: ["LogForm"]
      tests:
        - test_id: "greeting_api_log_create"
          description: "Log creation API accepts and validates input"
          type: "api_integration"
          expected:
            status: 201
            created_log_returned: true

    - endpoint_id: "greeting_logs_update"
      path: "/logs/:id"
      method: "PUT"
      description: "Update existing log entry"
      feature: "logs"
      component_usage: ["LogForm"]
      tests:
        - test_id: "greeting_api_log_update"
          description: "Log update API modifies and returns updated log"
          type: "api_integration"
          expected:
            status: 200
            updated_log_returned: true

    - endpoint_id: "greeting_logs_delete"
      path: "/logs/:id"
      method: "DELETE"
      description: "Delete specific log entry"
      feature: "logs"
      component_usage: ["LogDetails", "LogsList"]
      tests:
        - test_id: "greeting_api_log_delete"
          description: "Log deletion API removes log entry"
          type: "api_integration"
          expected:
            status: 204
            log_deleted: true

    - endpoint_id: "greeting_logs_clear"
      path: "/logs"
      method: "DELETE"
      description: "Clear all log entries"
      feature: "logs"
      component_usage: ["LogsList"]
      tests:
        - test_id: "greeting_api_logs_clear"
          description: "Clear all logs API removes all entries"
          type: "api_integration"
          expected:
            status: 204
            all_logs_cleared: true

