      - step: 7
        action: "click_element"
        target: "[data-testid='log-details-link']"
        expected: "navigates_to_log_details"
      - step: 8
        action: "click_element"
        target: "[data-testid='edit-log-button']"
        expected: "edit_form_opens"
      - step: 9
        action: "click_element"
        target: "[data-testid='delete-log-button']"
        expected: "log_deleted_successfully"
    tests:
      - test_id: "greeting_e2e_logs_crud"
        description: "Complete logs CRUD operations flow"
        type: "e2e_flow"
        browsers: ["chromium"]
        expected:
          completion_time_ms: "<20000"
          success_rate: "100%"
          crud_operations_work: true

  - flow_id: "greeting_logs_pagination_filter_flow"
    name: "Logs Pagination and Filtering Flow"
    description: "User navigates through paginated logs and uses filtering features"
    steps:
      - step: 1
        action: "navigate_to"
        target: "/greeting/logs"
        expected: "logs_page_loads"
      - step: 2
        action: "verify_content"
        target: "pagination_controls"
        expected: "pagination_visible"
      - step: 3
        action: "click_element"
        target: "[data-testid='next-page-button']"
        expected: "page_2_loads"
      - step: 4
        action: "verify_url_params"
        target: "page=2"
        expected: "url_updated_with_page"
      - step: 5
        action: "input_text"
        target: "[data-testid='search-input']"
        value: "error"
        expected: "search_applied"
      - step: 6
        action: "select_option"
        target: "[data-testid='level-filter']"
        value: "error"
        expected: "filter_applied"
      - step: 7
        action: "verify_content"
        target: "filtered_logs"
        expected: "only_error_logs_visible"
      - step: 8
        action: "click_element"
        target: "[data-testid='clear-filters-button']"
        expected: "filters_cleared"
    tests:
      - test_id: "greeting_e2e_logs_navigation"
        description: "Logs pagination and filtering functionality"
        type: "e2e_flow"
        browsers: ["chromium", "firefox"]
        expected:
          completion_time_ms: "<15000"
          success_rate: "100%"
          pagination_works: true
          filtering_works: true

  - flow_id: "greeting_responsive_mobile_flow"
    name: "Mobile Responsive Flow"
    description: "User accesses greeting app on mobile device and uses core features"
    steps:
      - step: 1
        action: "set_viewport"
        target: "mobile"
        size: "375x667"
        expected: "mobile_viewport_set"
      - step: 2
        action: "navigate_to"
        target: "/greeting/hello"
        expected: "mobile_page_loads"
      - step: 3
        action: "verify_responsive_layout"
        target: "page_layout"
        expected: "mobile_friendly_layout"
      - step: 4
        action: "scroll_to"
        target: "auth_form"
        expected: "auth_form_visible"
      - step: 5
        action: "tap_element"
        target: "[data-testid='api-key-input']"
        expected: "input_focused_mobile"
      - step: 6
        action: "input_text"
        target: "[data-testid='api-key-input']"
        value: "mobile-test-key"
        expected: "mobile_input_works"
      - step: 7
        action: "navigate_to"
        target: "/greeting/logs"
        expected: "logs_mobile_loads"
      - step: 8
        action: "verify_responsive_layout"
        target: "logs_layout"
        expected: "mobile_logs_layout"
    tests:
      - test_id: "greeting_e2e_mobile_responsive"
        description: "Mobile responsive design and functionality test"
        type: "e2e_flow"
        browsers: ["chromium"]
        expected:
          completion_time_ms: "<12000"
          success_rate: "100%"
          mobile_optimized: true

# Performance specifications
performance:
  metrics:
    - metric: "first_contentful_paint"
      target: "<1.5s"
      priority: "high"
    - metric: "largest_contentful_paint"
      target: "<2.5s"
      priority: "high"
    - metric: "cumulative_layout_shift"
      target: "<0.1"
      priority: "medium"
    - metric: "first_input_delay"
      target: "<100ms"
      priority: "high"
    - metric: "api_response_time"
      target: "<1000ms"
      priority: "high"

# Accessibility specifications
accessibility:
  wcag_level: "AA"
  requirements:
    - requirement: "keyboard_navigation"
      description: "All interactive elements keyboard accessible including greeting cards, forms, and navigation"
    - requirement: "screen_reader_support"
      description: "Proper ARIA labels for greeting status, authentication states, and log entries"
    - requirement: "color_contrast"
      description: "Minimum 4.5:1 contrast ratio for all text including badges and status indicators"
    - requirement: "focus_indicators"
      description: "Visible focus indicators on inputs, buttons, and interactive cards"
    - requirement: "semantic_html"
      description: "Proper heading hierarchy and semantic markup for greeting content and logs"

# Testing configuration
testing:
  unit_tests:
    framework: "vitest"
    coverage_threshold: 80
    test_pattern: "**/*.test.{ts,tsx}"
  e2e_tests:
    framework: "playwright"
    browsers: ["chromium", "firefox", "webkit"]
    test_pattern: "**/*.e2e.{ts,js}"
    parallelization: true
    mobile_testing: true
    accessibility_testing: true